name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests + coverage (fails under 80%)
        run: uv run pytest --cov-report=xml

  e2e:
    # Replays the committed LLM-generated tests against the live saucedemo.com.
    # No LLM in CI: generation needs Ollama or an API key and runs locally.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium

      - name: Generated tests still pass on the live app
        run: uv run pytest -m e2e tests/e2e/test_live_site.py -k generated --no-cov -v

  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
